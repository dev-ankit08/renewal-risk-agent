# Create the Slack app from this manifest: api.slack.com/apps > Create New App > From a manifest.
# Then: install to the workspace, copy the Bot token (xoxb-) to SLACK_BOT_TOKEN, and create an
# app-level token with connections:write (xapp-) for SLACK_APP_TOKEN (Socket Mode).
display_information:
  name: Renewal Risk
  description: Renewal risk, explained — with recommended next steps.
features:
  bot_user:
    display_name: Renewal Risk
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /renewal-risk
      description: Risk for an account or a renewal window
      usage_hint: "Acme Corp | at risk this quarter | high risk renewals next 90 days"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - app_mentions:read
      - im:history
      - im:write
      - users:read
      - users:read.email      # who is asking -> access.yaml
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
