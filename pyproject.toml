[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renewal-risk-agent"
version = "2.0.0"
description = "Platform-neutral renewal-risk agent: connect any CRM / billing / ERP / support / usage source, get explained risk and recommended actions in Slack and over an API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "python-dotenv>=1.0",
  "anthropic>=1.0",          # brings httpx2, used by the REST connector
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",  # admin UI file uploads
  "cryptography>=42",         # encrypted secret store
]

[project.optional-dependencies]
mcp = ["mcp>=2.2"]                       # Salesforce + generic MCP sources
sql = ["sqlalchemy>=2.0"]                # SQL sources (add your DB driver, e.g. psycopg)
slack = ["slack_bolt>=1.18", "slack_sdk>=3.27", "apscheduler>=3.10"]
xlsx = ["openpyxl>=3.1"]
all = ["renewal-risk-agent[mcp,sql,slack,xlsx]"]
dev = ["renewal-risk-agent[all]", "pytest>=8", "httpx>=0.27", "playwright>=1.48", "vulture>=2.11"]

[project.scripts]
renewal-risk = "renewal_risk.cli:main"

[tool.setuptools.packages.find]
include = ["renewal_risk*"]

[tool.setuptools.package-data]
renewal_risk = ["presets/*.yaml", "defaults/*.yaml", "packs/*.yaml", "service/static/*.html", "admin/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
