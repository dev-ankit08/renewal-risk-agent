# signals.yaml — signal registry with severity thresholds.
#
# Owned by a CS ops analyst, not an engineer. Specialists reference this file
# by signal `name`; changing a threshold here changes behavior with no code
# change. Keep names stable — evaluate.py's fabrication check and the brief
# renderer both key off them.

signals:
  - name: amount_decrease
    specialist: commercial
    description: Renewal opportunity Amount is lower than the current contract's ARR.
    source_fields: [Opportunity.Amount, OpportunityFieldHistory.Amount, Contract.ARR__c]
    thresholds:
      medium: "5-15% decrease"
      high: ">15% decrease"

  - name: opp_stalled
    specialist: commercial
    description: Renewal Opportunity has not changed stage in N days.
    source_fields: [Opportunity.StageName, OpportunityFieldHistory.StageName]
    thresholds:
      medium: "no stage change in 30-60 days"
      high: "no stage change in 60+ days"

  - name: contract_downgrade
    specialist: commercial
    description: CPQ amendment or Asset quantity/tier reduced vs. prior term.
    source_fields: [Asset.Quantity, Contract.ContractTerm]
    thresholds:
      medium: "single product/seat reduction"
      high: "multiple products dropped or tier downgrade"

  - name: case_volume_spike
    specialist: relationship
    description: Open Case count in the trailing 90 days vs. account's own baseline.
    source_fields: [Case.CreatedDate, CaseHistory]
    thresholds:
      medium: "2x baseline"
      high: "3x+ baseline"

  - name: support_escalation
    specialist: relationship
    description: Case Priority or Escalated flag on any open Case.
    source_fields: [Case.Priority, Case.IsEscalated]
    thresholds:
      medium: "1 escalated case"
      high: "2+ escalated cases, or any Priority=High"

  - name: champion_departed
    specialist: relationship
    description: Primary Contact Role's Contact record shows a departed/former status.
    source_fields: [Contact.Title, OpportunityContactRole.IsPrimary]
    thresholds:
      medium: "secondary contact marked departed/former"
      high: "primary/champion contact marked departed/former"

  - name: no_recent_activity
    specialist: relationship
    description: No logged Task or Event on the account in the trailing 60 days.
    source_fields: [Task.ActivityDate, Event.ActivityDate]
    thresholds:
      medium: "no activity in 60-90 days"
      high: "no activity in 90+ days"

  - name: low_engagement
    specialist: relationship
    description: Renewal Opportunity has no Contact Role beyond the original signer.
    source_fields: [OpportunityContactRole]
    thresholds:
      medium: "1 contact role"
      high: "0 contact roles"
