<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renewal Risk Agent</title>
<style>
  :root { --fg:#1a1a1a; --muted:#666; --line:#ddd; --bg:#fff; --soft:#f8fafc; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --line:#374151; --bg:#111827; --soft:#1f2937; --accent:#60a5fa; } }
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 820px; margin: 32px auto; padding: 0 16px; color: var(--fg); background: var(--bg); }
  .muted { color: var(--muted); font-size: .85em; margin-top: 4px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  input { width: 100%; font-size: 1rem; padding: 10px 12px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  #key { font-size: .85rem; margin-bottom: 8px; }
  button { margin-top: 10px; padding: 10px 18px; font-size: 1rem; border: none; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); margin-top: 10px; font-style: italic; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin: 16px 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .85rem; font-weight: 600; }
  .high { background: #fee2e2; color: #991b1b; } .medium { background: #fef3c7; color: #92400e; } .low { background: #dcfce7; color: #166534; }
  .notice { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: .92rem; vertical-align: top; }
  code { font-size: .8rem; color: var(--muted); }
  .cand { cursor: pointer; color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>
<h1>Renewal Risk Agent</h1>
<p class="sub">Ask about one company (“is Acme at risk”) or a window (“high risk renewals this quarter”).</p>
<input id="key" type="password" placeholder="API key (from access.yaml api_keys) — stored in this browser only">
<input id="q" type="text" placeholder="Type a question..." autofocus>
<button id="ask-btn">Ask</button>
<div id="status"></div>
<div id="results"></div>
<script>
const $ = id => document.getElementById(id);
try { $('key').value = localStorage.getItem('rr_key') || ''; } catch (e) {}
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
$('ask-btn').addEventListener('click', ask);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = (band, score) => band ? `<span class="badge ${esc(band)}">${score != null ? score + ' · ' : ''}${esc(band)}</span>` : '';

async function ask(text) {
  const question = (typeof text === 'string' ? text : $('q').value).trim();
  if (!question) return;
  const key = $('key').value.trim();
  try { localStorage.setItem('rr_key', key); } catch (e) {}
  $('ask-btn').disabled = true;
  $('status').textContent = 'Working… a new assessment takes 20-60s and uses API credits.';
  $('results').innerHTML = '';
  try {
    const resp = await fetch('/v1/ask', { method: 'POST', headers: {'Content-Type': 'application/json', 'X-API-Key': key}, body: JSON.stringify({question}) });
    const data = await resp.json();
    if (!resp.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail));
    render(data);
  } catch (err) {
    $('results').innerHTML = `<div class="notice">${esc(err.message || err)}</div>`;
  } finally { $('ask-btn').disabled = false; $('status').textContent = ''; }
}

function render(d) {
  if (d.type === 'single_account') return renderOne(d);
  if (d.type === 'bulk_window') return renderMany(d);
  let html = `<div class="notice">${esc(d.message)}`;
  if (d.candidates && d.candidates.length) {
    html += '<ul>' + d.candidates.map(c => `<li class="cand" data-name="${esc(c.name)}">${esc(c.name)}</li>`).join('') + '</ul>';
  }
  $('results').innerHTML = html + '</div>';
  document.querySelectorAll('.cand').forEach(el => el.addEventListener('click', () => ask(el.dataset.name)));
}

function renderOne(r) {
  const actions = (r.recommended_actions || []).map(a => `<li><strong>${esc(a.action)}</strong> — ${esc(a.owner_role)}, ${esc(a.priority)} priority, within ${a.due_in_days} days</li>`).join('');
  const signals = (r.signals || []).map(s => `<tr><td>${badge(s.severity)}</td><td>${esc(s.name)}</td><td>${esc(s.value)}<br><code>${esc(s.evidence_ref)}</code>${s.how_calculated ? `<div class="muted"><em>How it's calculated:</em> ${esc(s.how_calculated)}</div>` : ''}</td></tr>`).join('');
  $('results').innerHTML = `<div class="card">
    <h2>${esc(r.account_name)} ${r.abstained ? '<span class="badge">not enough data</span>' : badge(r.band, r.score)}</h2>
    ${r.coverage && r.coverage.total ? `<p class="muted">${r.coverage.checked} of ${r.coverage.total} warning signs could be checked${r.abstained ? ' — too few to call this account low risk.' : '.'}</p>` : ''}
    <p>${esc(r.rationale)}</p>
    <h3>Recommended actions</h3><ul>${actions || '<li>none</li>'}</ul>
    <h3>Evidence</h3><table>${signals || '<tr><td>No signals.</td></tr>'}</table>
    <p><code>As of ${esc(r.as_of)}${r.from_cache ? ' · stored assessment' : ''}${r.cost_usd ? ' · $' + r.cost_usd : ''}</code></p>
  </div>`;
}

function renderMany(r) {
  const rows = r.rows.map(row => `<tr><td>${esc(row.name)}</td><td>${esc(row.close_date)}</td>
    <td>${row.amount != null ? Number(row.amount).toLocaleString() : ''}</td>
    <td>${row.band_source === 'not_enough_data' ? '<span class="badge">not enough data</span>' : badge(row.band, row.score)} ${row.band_source === 'screen' ? '<code>screen only</code>' : ''}</td>
    <td>${esc(row.assessment ? row.assessment.rationale : (row.screen ? row.screen.signals.map(s => s.value).join('; ') : row.error || ''))}</td></tr>`).join('');
  $('results').innerHTML = `<p><strong>${esc(r.label)}</strong> (${esc(r.window_start)} – ${esc(r.window_end)}): ${r.renewals_in_window} renewal(s) you can see, ${r.assessed_now} assessed now${r.cost_usd ? ' ($' + r.cost_usd + ')' : ''}.</p>
    ${r.not_assessed_flagged ? `<div class="notice">${r.not_assessed_flagged} more flagged account(s) were screened but not fully assessed (per-question cap).</div>` : ''}
    <table><thead><tr><th>Account</th><th>Renewal</th><th>Amount</th><th>Risk</th><th>Why</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5">No matching renewals.</td></tr>'}</tbody></table>`;
}
</script>
</body>
</html>
